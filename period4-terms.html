<script>
(function () {
  "use strict";
  var REQUIRED = [{"category":"The War of 1812 & Foreign Affairs","term":"Thomas Jefferson","year":"1743-1826; Pres. 1801-1809","ch":"P4","def":"Third President; pursued the Louisiana Purchase and economic coercion (embargo) rather than war despite British/French provocations.","similar":"Louisiana Purchase; Embargo Act"},{"category":"The War of 1812 & Foreign Affairs","term":"Louisiana Purchase","year":"1803","ch":"P4","def":"U.S. purchase of French territory west of the Mississippi from Napoleon, doubling the nation's size and raising constitutional questions about federal power.","similar":"Thomas Jefferson; Lewis and Clark"},{"category":"The War of 1812 & Foreign Affairs","term":"War Hawks","year":"c. 1810-1812","ch":"P4","def":"Young nationalist congressmen (Clay, Calhoun) who pushed for war with Britain over impressment and frontier conflicts with Native tribes.","similar":"Henry Clay; John C. Calhoun"},{"category":"The War of 1812 & Foreign Affairs","term":"Impressment","year":"Ongoing through War of 1812","ch":"P4","def":"British practice of forcibly seizing American sailors for Royal Navy service; a major cause of the War of 1812.","similar":"War of 1812; Embargo Act"},{"category":"The War of 1812 & Foreign Affairs","term":"Embargo Act (1807)","year":"1807","ch":"P4","def":"Jefferson's ban on American ships trading with foreign nations, intended to pressure Britain/France but devastating to U.S. merchants; repealed 1809.","similar":"Impressment; Nonintercourse Act"},{"category":"The War of 1812 & Foreign Affairs","term":"Tecumseh and the Prophet","year":"Active c. 1805-1813","ch":"P4","def":"Shawnee brothers who built a pan-Indian confederacy resisting U.S. expansion; defeated at Tippecanoe (1811), Tecumseh died fighting with the British in 1813.","similar":"Battle of Tippecanoe"},{"category":"The War of 1812 & Foreign Affairs","term":"War of 1812","year":"1812-1815","ch":"P4","def":"Conflict with Britain over impressment, trade restrictions, and frontier issues; ended in stalemate but boosted American nationalism.","similar":"Treaty of Ghent; Battle of New Orleans"},{"category":"The War of 1812 & Foreign Affairs","term":"Battle of New Orleans","year":"January 1815","ch":"P4","def":"Andrew Jackson's decisive victory over British forces, fought after the peace treaty was signed but before news reached America; made Jackson a national hero.","similar":"Andrew Jackson; Treaty of Ghent"},{"category":"The War of 1812 & Foreign Affairs","term":"Treaty of Ghent (1814)","year":"1814","ch":"P4","def":"Ended the War of 1812, restoring prewar boundaries with no mention of impressment or the issues that had caused the war.","similar":"War of 1812"},{"category":"The War of 1812 & Foreign Affairs","term":"Hartford Convention (1814)","year":"1814","ch":"P4","def":"Meeting of New England Federalists who opposed the War of 1812 and discussed grievances/secession; the party's association with disloyalty contributed to its collapse.","similar":"War of 1812"},{"category":"Postwar Nationalism & the Supreme Court","term":"Era of Good Feelings","year":"c. 1817-1825","ch":"P4","def":"Period of one-party rule and apparent national unity under Monroe, though sectional tensions simmered beneath the surface.","similar":"James Monroe"},{"category":"Postwar Nationalism & the Supreme Court","term":"James Monroe","year":"1758-1831; Pres. 1817-1825","ch":"P4","def":"Fifth President during the Era of Good Feelings; issued the Monroe Doctrine.","similar":"Monroe Doctrine"},{"category":"Postwar Nationalism & the Supreme Court","term":"Monroe Doctrine (1823)","year":"1823","ch":"P4","def":"Declared the Western Hemisphere closed to further European colonization, asserting U.S. influence in the Americas.","similar":"James Monroe"},{"category":"Postwar Nationalism & the Supreme Court","term":"John Marshall","year":"Chief Justice 1801-1835","ch":"P4","def":"Supreme Court Chief Justice whose rulings (Marbury, McCulloch, Gibbons) established judicial review and strengthened federal power.","similar":"Marbury v. Madison; McCulloch v. Maryland"},{"category":"Postwar Nationalism & the Supreme Court","term":"Marbury v. Madison","year":"1803","ch":"P4","def":"Established the principle of judicial review, giving the Supreme Court power to strike down unconstitutional laws.","similar":"John Marshall"},{"category":"Postwar Nationalism & the Supreme Court","term":"McCulloch v. Maryland","year":"1819","ch":"P4","def":"Upheld the constitutionality of the national bank and established that states cannot tax federal institutions, affirming implied powers.","similar":"Second Bank of the U.S."},{"category":"Postwar Nationalism & the Supreme Court","term":"Gibbons v. Ogden","year":"1824","ch":"P4","def":"Established federal authority over interstate commerce, broadly interpreting the Commerce Clause.","similar":"John Marshall"},{"category":"Postwar Nationalism & the Supreme Court","term":"Missouri Compromise (1820)","year":"1820","ch":"P4","def":"Admitted Missouri as a slave state and Maine as a free state while banning slavery north of 36°30' in the Louisiana territory, temporarily easing sectional tension.","similar":"Tallmadge Amendment"},{"category":"The Market Revolution & Industry","term":"Market Revolution","year":"c. 1815-1840s","ch":"P4","def":"Transformation of the American economy through transportation improvements, factory production, and growing interstate/international trade.","similar":"Erie Canal; Railroads"},{"category":"The Market Revolution & Industry","term":"Erie Canal","year":"Completed 1825","ch":"P4","def":"Canal linking the Hudson River to Lake Erie, dramatically cutting transport costs and spurring the growth of New York City and western settlement.","similar":"Market Revolution"},{"category":"The Market Revolution & Industry","term":"Henry Clay's American System","year":"Proposed 1810s-1820s","ch":"P4","def":"Economic plan combining a protective tariff, national bank, and internal improvements to unify and strengthen the national economy.","similar":"Second Bank of the U.S.; Tariff of 1816"},{"category":"The Market Revolution & Industry","term":"Second Bank of the United States","year":"Chartered 1816","ch":"P4","def":"National bank meant to stabilize currency and credit; became a central issue in Jackson's presidency (the 'Bank War').","similar":"Nicholas Biddle; Pet Banks"},{"category":"The Market Revolution & Industry","term":"Eli Whitney; Interchangeable Parts","year":"Cotton gin 1793; parts system early 1800s","ch":"P4","def":"Inventor of the cotton gin (boosting cotton/slavery) and pioneer of interchangeable parts manufacturing, enabling mass production.","similar":"King Cotton; Market Revolution"},{"category":"The Market Revolution & Industry","term":"Lowell System; Textile Mills","year":"1820s-1830s","ch":"P4","def":"Massachusetts factory system employing young farm women in textile mills with supervised housing — an early model of industrial labor.","similar":"Factory system; Industrialization"},{"category":"The Market Revolution & Industry","term":"Panic of 1819","year":"1819","ch":"P4","def":"First major U.S. financial crisis, caused by bank over-speculation in western land; led to widespread foreclosures and distrust of banks.","similar":"Second Bank of the U.S."},{"category":"The Market Revolution & Industry","term":"Railroads","year":"Expanding from 1830s","ch":"P4","def":"New transportation technology that increasingly rivaled canals, tying the Northeast and Midwest economies together.","similar":"Erie Canal; Market Revolution"},{"category":"Jacksonian Democracy & Politics","term":"Common Man; Universal White Male Suffrage","year":"1820s-1830s","ch":"P4","def":"Expansion of voting rights to all white men regardless of property ownership, broadening democratic participation in this era.","similar":"Andrew Jackson"},{"category":"Jacksonian Democracy & Politics","term":"Andrew Jackson","year":"1767-1845; Pres. 1829-1837","ch":"P4","def":"Seventh President, symbol of the 'common man,' known for the spoils system, the Bank War, and Indian Removal.","similar":"Spoils system; Indian Removal Act"},{"category":"Jacksonian Democracy & Politics","term":"\"Corrupt Bargain\"","year":"Election of 1824","ch":"P4","def":"Jackson supporters' term for the 1824 outcome, in which Henry Clay's support helped John Quincy Adams win in the House, and Clay was then named Secretary of State.","similar":"Henry Clay; John Quincy Adams"},{"category":"Jacksonian Democracy & Politics","term":"Spoils System","year":"Practiced widely from 1829","ch":"P4","def":"Practice of rewarding political supporters with government jobs; associated with Jackson's 'rotation in office.'","similar":"Andrew Jackson"},{"category":"Jacksonian Democracy & Politics","term":"Tariff of 1828; \"Tariff of Abominations\"","year":"1828","ch":"P4","def":"High protective tariff deeply unpopular in the South, which saw it as benefiting Northern industry at Southern expense.","similar":"Nullification Crisis"},{"category":"Jacksonian Democracy & Politics","term":"Nullification Crisis","year":"1832-1833","ch":"P4","def":"Confrontation after South Carolina declared the tariff null and void within its borders, testing federal authority; resolved by a compromise tariff and the Force Bill.","similar":"Tariff of 1828; John C. Calhoun"},{"category":"Jacksonian Democracy & Politics","term":"Indian Removal Act (1830)","year":"1830","ch":"P4","def":"Authorized the forced relocation of Native American tribes from the Southeast to land west of the Mississippi.","similar":"Cherokee Trail of Tears"},{"category":"Jacksonian Democracy & Politics","term":"Cherokee Trail of Tears","year":"1838-1839","ch":"P4","def":"Forced march of the Cherokee Nation to Indian Territory, resulting in thousands of deaths despite the Supreme Court's ruling in their favor in Worcester v. Georgia.","similar":"Indian Removal Act"},{"category":"Jacksonian Democracy & Politics","term":"Panic of 1837; Martin Van Buren","year":"1837-1843; Van Buren Pres. 1837-1841","ch":"P4","def":"Severe economic depression that struck shortly after Van Buren took office, linked partly to Jackson's hard-money policies (Specie Circular).","similar":"Specie Circular"},{"category":"Jacksonian Democracy & Politics","term":"Whigs and Democrats; Two-Party System","year":"Formed 1830s","ch":"P4","def":"Rival parties emerging from Jacksonian-era politics: Democrats (Jackson's coalition) versus Whigs (opponents of 'King Andrew').","similar":"Andrew Jackson"},{"category":"Reform Movements & Religion","term":"Second Great Awakening","year":"c. 1790s-1840s","ch":"P4","def":"Protestant religious revival movement emphasizing personal salvation and reform, inspiring many antebellum social reform movements.","similar":"Revivalism"},{"category":"Reform Movements & Religion","term":"Revivalism; Revival (Camp) Meetings","year":"1800s-1830s","ch":"P4","def":"Large outdoor religious gatherings central to the Second Great Awakening, emphasizing emotional conversion experiences.","similar":"Second Great Awakening"},{"category":"Reform Movements & Religion","term":"Church of Latter-Day Saints; Joseph Smith","year":"Founded 1830","ch":"P4","def":"New religious movement founded by Joseph Smith; Mormons faced persecution and migrated west under Brigham Young to found 'New Zion' (Utah).","similar":"Brigham Young"},{"category":"Reform Movements & Religion","term":"Temperance Movement; American Temperance Society","year":"Founded 1826","ch":"P4","def":"Reform movement aimed at reducing or eliminating alcohol consumption, tied to broader moral reform efforts of the era.","similar":"Second Great Awakening"},{"category":"Reform Movements & Religion","term":"Horace Mann; Public School Movement","year":"1830s-1840s","ch":"P4","def":"Massachusetts reformer who championed tax-funded public education, standardized curricula, and better-trained teachers.","similar":"McGuffey Readers"},{"category":"Reform Movements & Religion","term":"Dorothea Dix; Asylum Movement","year":"1840s","ch":"P4","def":"Reformer who exposed the mistreatment of the mentally ill and advocated for dedicated asylums rather than prisons/poorhouses.","similar":"Penitentiaries"},{"category":"Reform Movements & Religion","term":"Auburn System; Penitentiaries","year":"Developed 1820s-1830s","ch":"P4","def":"Prison reform model emphasizing silent labor and moral rehabilitation rather than purely punitive confinement.","similar":"Dorothea Dix"},{"category":"Reform Movements & Religion","term":"Utopian Communities","year":"1820s-1840s","ch":"P4","def":"Experimental communal societies (Shakers, Oneida, New Harmony, Brook Farm) seeking to build ideal social and economic orders outside mainstream society.","similar":"New Harmony; Oneida Community"},{"category":"Reform Movements & Religion","term":"Transcendentalism; Emerson; Thoreau","year":"1830s-1850s","ch":"P4","def":"Philosophical/literary movement emphasizing individualism, intuition, and the spiritual value of nature over materialism and conformity.","similar":"Brook Farm"},{"category":"Reform Movements & Religion","term":"Antebellum Period","year":"c. 1812-1861","ch":"P4","def":"General term for the pre-Civil War era marked by reform movements, westward expansion, and deepening sectional conflict.","similar":"Second Great Awakening"},{"category":"Abolition & Slavery","term":"William Lloyd Garrison; The Liberator","year":"Founded 1831","ch":"P4","def":"Radical abolitionist newspaper editor who called for the immediate, uncompensated end of slavery.","similar":"American Antislavery Society"},{"category":"Abolition & Slavery","term":"Frederick Douglass; The North Star","year":"Newspaper founded 1847","ch":"P4","def":"Formerly enslaved abolitionist, orator, and writer whose autobiography and newspaper powerfully advanced the antislavery cause.","similar":"William Lloyd Garrison"},{"category":"Abolition & Slavery","term":"Harriet Tubman","year":"c. 1822-1913","ch":"P4","def":"Formerly enslaved 'conductor' on the Underground Railroad who led dozens of enslaved people to freedom.","similar":"Frederick Douglass"},{"category":"Abolition & Slavery","term":"American Colonization Society","year":"Founded 1816","ch":"P4","def":"Organization promoting the resettlement of free Black Americans in Africa (Liberia); reflected ambivalence even among some antislavery whites.","similar":"Abolitionism"},{"category":"Abolition & Slavery","term":"American Antislavery Society","year":"Founded 1833","ch":"P4","def":"National abolitionist organization led by Garrison and others advocating immediate emancipation.","similar":"William Lloyd Garrison"},{"category":"Abolition & Slavery","term":"Nat Turner's Rebellion","year":"1831","ch":"P4","def":"Violent slave uprising in Virginia that killed dozens of whites and led to harsher slave codes and restrictions across the South.","similar":"Slave Codes; Denmark Vesey"},{"category":"Abolition & Slavery","term":"King Cotton; Slave Codes","year":"Cotton economy 1800s-1860s","ch":"P4","def":"'King Cotton' describes the South's dependence on cotton and slave labor; Slave Codes were laws restricting the rights and movement of enslaved people.","similar":"Eli Whitney; Nat Turner"},{"category":"Abolition & Slavery","term":"Denmark Vesey","year":"Planned 1822","ch":"P4","def":"Free Black man who planned a large slave revolt in Charleston, South Carolina, that was discovered before it occurred, leading to increased Southern fear and repression.","similar":"Nat Turner"},{"category":"Women's Rights & New Ideas","term":"Seneca Falls Convention (1848)","year":"1848","ch":"P4","def":"First women's rights convention in the U.S., producing the Declaration of Sentiments modeled on the Declaration of Independence.","similar":"Elizabeth Cady Stanton"},{"category":"Women's Rights & New Ideas","term":"Elizabeth Cady Stanton","year":"1815-1902","ch":"P4","def":"Leading organizer of the Seneca Falls Convention and author of the Declaration of Sentiments demanding women's rights, including suffrage.","similar":"Seneca Falls Convention; Susan B. Anthony"},{"category":"Women's Rights & New Ideas","term":"Susan B. Anthony","year":"1820-1906","ch":"P4","def":"Prominent women's rights and suffrage activist who partnered closely with Stanton in the movement.","similar":"Elizabeth Cady Stanton"},{"category":"Women's Rights & New Ideas","term":"Cult of Domesticity","year":"Prevailing ideology, mid-1800s","ch":"P4","def":"Idealized view of women's proper role as centered on home, family, and moral guidance rather than public/political life; reform movements challenged this.","similar":"Women's Rights Movement"},{"category":"Women's Rights & New Ideas","term":"Sarah and Angelina Grimke","year":"Active 1830s-1840s","ch":"P4","def":"Southern-born sisters who became prominent abolitionist and women's rights advocates, linking the two causes.","similar":"William Lloyd Garrison; Women's Rights"},{"category":"Women's Rights & New Ideas","term":"Hudson River School; Thomas Cole","year":"1820s-1870s","ch":"P4","def":"American landscape painting movement celebrating the grandeur of the American wilderness, reflecting national pride and Romantic ideals.","similar":"Transcendentalism"},{"category":"Immigration & Identity","term":"Nativism; Know-Nothing (American) Party","year":"Party formed 1850s","ch":"P4","def":"Anti-immigrant political movement opposing Irish and German Catholic immigration, fearing loss of 'American' culture and jobs.","similar":"Irish Immigration"},{"category":"Immigration & Identity","term":"Irish Immigration; Potato Famine","year":"Famine 1845-1852","ch":"P4","def":"Mass Irish immigration to the U.S. driven by famine in Ireland; immigrants faced discrimination and often settled in growing cities.","similar":"Know-Nothing Party"},{"category":"Immigration & Identity","term":"Planters; \"Codes of Chivalry\"","year":"Antebellum South, 1800s-1860s","ch":"P4","def":"Wealthy Southern slaveholding elite who dominated the region's economy, politics, and social ideals of honor.","similar":"King Cotton"},{"category":"Immigration & Identity","term":"Urbanization","year":"Accelerating 1820s-1850s","ch":"P4","def":"Rapid growth of American cities driven by immigration and industrialization, creating new social and public health challenges.","similar":"Irish Immigration; Market Revolution"},{"category":"Immigration & Identity","term":"Tammany Hall","year":"Prominent from early-mid 1800s","ch":"P4","def":"New York City Democratic political machine that built support (including among immigrants) through patronage and favors.","similar":"Irish Immigration"},{"category":"Westward Expansion & Manifest Destiny","term":"Manifest Destiny","year":"Term popularized 1845","ch":"P4","def":"Belief that American expansion across the continent was divinely ordained and inevitable; used to justify westward expansion and war with Mexico.","similar":"Mexican-American War"},{"category":"Westward Expansion & Manifest Destiny","term":"Texas Independence; Sam Houston; the Alamo","year":"1835-1836","ch":"P4","def":"American settlers in Mexican Texas revolted and won independence after the famous siege of the Alamo (1836); Texas remained an independent republic until annexed in 1845.","similar":"Stephen Austin"},{"category":"Westward Expansion & Manifest Destiny","term":"Oregon Territory; \"Fifty-Four Forty or Fight!\"","year":"Dispute resolved 1846","ch":"P4","def":"Territorial dispute with Britain over the Pacific Northwest; settled by treaty at the 49th parallel rather than the more aggressive line demanded by expansionists.","similar":"James K. Polk"},{"category":"Westward Expansion & Manifest Destiny","term":"James K. Polk","year":"1795-1849; Pres. 1845-1849","ch":"P4","def":"Expansionist President who oversaw the annexation of Texas, the Oregon settlement, and the Mexican-American War.","similar":"Manifest Destiny"},{"category":"Westward Expansion & Manifest Destiny","term":"Mexican-American War","year":"1846-1848","ch":"P4","def":"War fought over Texas's disputed border and American expansionist ambitions; resulted in the U.S. acquiring vast new southwestern territory.","similar":"Treaty of Guadalupe-Hidalgo"},{"category":"Westward Expansion & Manifest Destiny","term":"Treaty of Guadalupe-Hidalgo (1848)","year":"1848","ch":"P4","def":"Ended the Mexican-American War; Mexico ceded California and the Southwest (Mexican Cession) to the U.S. in exchange for payment.","similar":"Mexican Cession"},{"category":"Westward Expansion & Manifest Destiny","term":"Mexican Cession","year":"1848","ch":"P4","def":"Vast territory (including California, Nevada, Utah, and parts of other states) ceded by Mexico after the war, reigniting debates over slavery's expansion.","similar":"Wilmot Proviso"},{"category":"Westward Expansion & Manifest Destiny","term":"Wilmot Proviso","year":"Proposed 1846","ch":"P4","def":"Failed proposal to ban slavery in any territory gained from the Mexican-American War; intensified sectional conflict despite never passing.","similar":"Mexican Cession"},{"category":"Westward Expansion & Manifest Destiny","term":"Stephen Austin","year":"1793-1836","ch":"P4","def":"Empresario who led the first major legal American settlement in Mexican Texas, foundational to Texas's development and eventual independence.","similar":"Texas Independence"},{"category":"Westward Expansion & Manifest Destiny","term":"American Indian Removal; Great Plains Migration","year":"1830s-1840s","ch":"P4","def":"Broader policy and process of displacing Native peoples from both the Southeast and advancing frontier to lands further west, including the Great Plains.","similar":"Indian Removal Act"}];
  var EXTRA = [{"category":"Extra Credit","term":"John C. Calhoun","year":"1782-1850","ch":"P4","def":"War Hawk turned leading Southern states'-rights advocate; developed nullification theory and later opposed the tariff as Vice President under Jackson.","similar":"Nullification Crisis; War Hawks"},{"category":"Extra Credit","term":"Henry Clay","year":"1777-1852","ch":"P4","def":"'Great Compromiser'; War Hawk, architect of the American System, and longtime Whig leader behind the Missouri Compromise and later the Compromise of 1850.","similar":"American System; War Hawks"},{"category":"Extra Credit","term":"Francis Scott Key; \"The Star-Spangled Banner\"","year":"Written 1814","ch":"P4","def":"Key wrote the poem that became the U.S. national anthem after witnessing the British bombardment of Fort McHenry during the War of 1812.","similar":"War of 1812"},{"category":"Extra Credit","term":"Battle of Tippecanoe; William Henry Harrison","year":"1811","ch":"P4","def":"U.S. victory over Tecumseh's confederacy in the Indiana Territory, boosting Harrison's reputation (later President in 1841).","similar":"Tecumseh"},{"category":"Extra Credit","term":"Battle of Lake Erie; Oliver Hazard Perry","year":"1813","ch":"P4","def":"American naval victory securing U.S. control of Lake Erie during the War of 1812.","similar":"War of 1812"},{"category":"Extra Credit","term":"Battle of Horseshoe Bend; Creek War","year":"1814","ch":"P4","def":"Andrew Jackson's decisive victory over the Creek Nation, resulting in a major Creek land cession.","similar":"Andrew Jackson"},{"category":"Extra Credit","term":"Napoleon Bonaparte; Barbary Pirates","year":"Early 1800s","ch":"P4","def":"European and North African conflicts entangling the young U.S. in questions of neutral trading rights and naval defense.","similar":"Louisiana Purchase"},{"category":"Extra Credit","term":"Lewis and Clark Expedition","year":"1804-1806","ch":"P4","def":"Expedition commissioned by Jefferson to explore and map the Louisiana Purchase territory and reach the Pacific.","similar":"Louisiana Purchase; Thomas Jefferson"},{"category":"Extra Credit","term":"Fletcher v. Peck; Dartmouth College v. Woodward","year":"1810; 1819","ch":"P4","def":"Marshall Court rulings protecting the sanctity of contracts from state interference, strengthening property rights and limiting state power.","similar":"John Marshall"},{"category":"Extra Credit","term":"Tallmadge Amendment","year":"1819","ch":"P4","def":"Failed proposal to gradually end slavery in Missouri, which touched off the crisis resolved by the Missouri Compromise.","similar":"Missouri Compromise"},{"category":"Extra Credit","term":"Nicholas Biddle; Roger Taney","year":"1820s-1830s","ch":"P4","def":"Biddle led the Second Bank of the U.S.; Taney, Jackson's ally, helped dismantle it and later became Chief Justice.","similar":"Second Bank of the U.S."},{"category":"Extra Credit","term":"Specie Circular (1836)","year":"1836","ch":"P4","def":"Jackson administration order requiring payment in gold/silver for public land, intended to curb speculation but contributing to the Panic of 1837.","similar":"Panic of 1837"},{"category":"Extra Credit","term":"\"Pet Banks\"","year":"1833 onward","ch":"P4","def":"State banks that received federal deposits after Jackson withdrew funds from the Second Bank of the United States.","similar":"Second Bank of the U.S."},{"category":"Extra Credit","term":"Anti-Masonic Party; Workingmen's Party","year":"1820s-1830s","ch":"P4","def":"Early third parties reflecting new political movements and anxieties of the Jacksonian era; the Anti-Masons held the first party nominating convention.","similar":"Two-Party System"},{"category":"Extra Credit","term":"Worcester v. Georgia; Cherokee Nation v. Georgia","year":"1831; 1832","ch":"P4","def":"Supreme Court cases affirming tribal sovereignty; Jackson reportedly ignored the ruling, allowing removal to proceed.","similar":"Cherokee Trail of Tears"},{"category":"Extra Credit","term":"Robert Owen; New Harmony","year":"Founded 1825","ch":"P4","def":"British industrialist-reformer who founded a short-lived utopian socialist community in Indiana.","similar":"Utopian Communities"},{"category":"Extra Credit","term":"Oneida Community; John Humphrey Noyes","year":"Founded 1848","ch":"P4","def":"Utopian religious community in New York practicing communal property and controversial social/marital arrangements under Noyes's leadership.","similar":"Utopian Communities"},{"category":"Extra Credit","term":"Brook Farm; George Ripley","year":"Founded 1841","ch":"P4","def":"Transcendentalist utopian community in Massachusetts emphasizing intellectual life alongside manual labor.","similar":"Transcendentalism"},{"category":"Extra Credit","term":"Margaret Fuller","year":"1810-1850","ch":"P4","def":"Transcendentalist writer, journalist, and early feminist who argued for women's intellectual equality.","similar":"Transcendentalism; Women's Rights"},{"category":"Extra Credit","term":"Liberty Party","year":"Founded 1840","ch":"P4","def":"Early antislavery political party advocating abolition through the political process rather than moral suasion alone.","similar":"Abolitionism"},{"category":"Extra Credit","term":"Sojourner Truth","year":"c. 1797-1883","ch":"P4","def":"Formerly enslaved abolitionist and women's rights advocate known for powerful public speaking.","similar":"Abolitionism; Women's Rights"},{"category":"Extra Credit","term":"American Peace Society","year":"Founded 1828","ch":"P4","def":"Reform organization promoting pacifism and opposition to war, part of the broader antebellum reform impulse.","similar":"Reform Movements"},{"category":"Extra Credit","term":"McGuffey Readers","year":"First published 1836","ch":"P4","def":"Widely used elementary school textbooks that shaped morality and literacy instruction for generations of American children.","similar":"Public School Movement"},{"category":"Extra Credit","term":"Washington Irving; James Fenimore Cooper; Nathaniel Hawthorne","year":"Early-mid 1800s","ch":"P4","def":"Early American authors who helped establish a distinctly national literature during the antebellum period.","similar":"Hudson River School"},{"category":"Extra Credit","term":"Ostend Manifesto (1854)","year":"1854","ch":"P4","def":"Leaked proposal by U.S. diplomats suggesting the purchase or seizure of Cuba from Spain, embarrassing the Pierce administration and fueling sectional suspicion over slavery's expansion.","similar":"Manifest Destiny"}];

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function showTab(tab) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute("aria-selected", on ? "true" : "false");
      var panel = document.getElementById(t.getAttribute("aria-controls"));
      if (panel) panel.hidden = !on;
    });
    window.scrollTo(0, 0);
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { showTab(t); }); });

  function render(host, terms, filterText) {
    host.innerHTML = "";
    var q = (filterText || "").toLowerCase();
    var lastCat = null;
    terms.forEach(function (t) {
      if (q && !(t.term.toLowerCase().indexOf(q) !== -1 || t.def.toLowerCase().indexOf(q) !== -1 || t.category.toLowerCase().indexOf(q) !== -1)) return;
      if (t.category !== lastCat && t.category !== "Extra Credit") {
        host.appendChild(el("div", "cat-heading", esc(t.category)));
        lastCat = t.category;
      }
      var d = el("details");
      d.appendChild(el("summary", "", '<span>' + esc(t.term) + '</span><span class="chip">' + esc(t.year) + '</span>'));
      var body = el("div", "body");
      body.innerHTML = "<p>" + esc(t.def) + "</p>" +
        '<div class="label">Similar / related terms</div><p class="muted">' + esc(t.similar) + "</p>";
      d.appendChild(body);
      host.appendChild(d);
    });
    if (!host.children.length) host.appendChild(el("p", "muted", "No terms match your search."));
  }

  var reqHost = document.getElementById("reqHost");
  var extraHost = document.getElementById("extraHost");
  render(reqHost, REQUIRED, "");
  render(extraHost, EXTRA, "");

  document.getElementById("searchReq").addEventListener("input", function (e) { render(reqHost, REQUIRED, e.target.value); });
  document.getElementById("searchExtra").addEventListener("input", function (e) { render(extraHost, EXTRA, e.target.value); });
})();
</script>
