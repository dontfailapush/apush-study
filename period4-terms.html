<script>
(function () {
  "use strict";
  var REQUIRED = [{"category":"The War of 1812 & Foreign Affairs","term":"Thomas Jefferson","year":"1743-1826; Pres. 1801-1809","ch":"P4","def":"Definition: Third President; pursued the Louisiana Purchase and economic coercion (embargo) rather than war despite British/French provocations. Significance: His choice of economic coercion over war set a precedent for using trade policy as a weapon, but the Embargo's failure showed the limits of that strategy and hurt his own party's popularity in New England.","similar":"Louisiana Purchase; Embargo Act"},{"category":"The War of 1812 & Foreign Affairs","term":"Louisiana Purchase","year":"1803","ch":"P4","def":"Definition: U.S. purchase of French territory west of the Mississippi from Napoleon, doubling the nation's size and raising constitutional questions about federal power. Significance: It secured American control of the Mississippi and New Orleans and set the template for westward expansion, even though Jefferson had to set aside his own strict-constructionist principles to justify it.","similar":"Thomas Jefferson; Lewis and Clark"},{"category":"The War of 1812 & Foreign Affairs","term":"War Hawks","year":"c. 1810-1812","ch":"P4","def":"Definition: Young nationalist congressmen (Clay, Calhoun) who pushed for war with Britain over impressment and frontier conflicts with Native tribes. Significance: Their push for war reflected a new, more aggressive nationalism in American politics after 1800, and their influence helped drag a reluctant Madison into the War of 1812.","similar":"Henry Clay; John C. Calhoun"},{"category":"The War of 1812 & Foreign Affairs","term":"Impressment","year":"Ongoing through War of 1812","ch":"P4","def":"Definition: British practice of forcibly seizing American sailors for Royal Navy service; a major cause of the War of 1812. Significance: It was one of the central grievances, alongside trade restrictions, that pushed the United States into declaring war on Britain in 1812.","similar":"War of 1812; Embargo Act"},{"category":"The War of 1812 & Foreign Affairs","term":"Embargo Act (1807)","year":"1807","ch":"P4","def":"Definition: Jefferson's ban on American ships trading with foreign nations, intended to pressure Britain/France but devastating to U.S. merchants; repealed 1809. Significance: It devastated the American economy without forcing Britain to change course, exposing the limits of economic pressure as an alternative to war and badly hurting Jefferson's popularity.","similar":"Impressment; Nonintercourse Act"},{"category":"The War of 1812 & Foreign Affairs","term":"Tecumseh","year":"c. 1768–1813","ch":"P4","def":"Definition: Shawnee military and diplomatic leader who built a multi-tribal confederacy to resist U.S. expansion, allied with the British, and was killed at the Battle of the Thames in 1813. Significance: His death ended the last major pan-Indian military alliance east of the Mississippi and the possibility of a unified Indian resistance to U.S. expansion.","similar":"Battle of Tippecanoe; Battle of the Thames"},{"category":"The War of 1812 & Foreign Affairs","term":"Tenskwatawa (the Prophet)","year":"c. 1775–1836","ch":"P4","def":"Definition: Tecumseh's half-brother, a religious leader who preached rejection of European goods and customs and founded Prophetstown as a center of spiritual renewal. Significance: His religious movement gave Tecumseh's political and military alliance a unifying spiritual foundation, though defeat at Tippecanoe in 1811 badly damaged his authority.","similar":"Battle of Tippecanoe; Tecumseh"},{"category":"The War of 1812 & Foreign Affairs","term":"War of 1812","year":"1812-1815","ch":"P4","def":"Definition: Conflict with Britain over impressment, trade restrictions, and frontier issues; ended in stalemate but boosted American nationalism. Significance: Though militarily inconclusive, the war ended major Indian military resistance east of the Mississippi, discredited the Federalist Party, and fueled a surge of postwar American nationalism.","similar":"Treaty of Ghent; Battle of New Orleans"},{"category":"The War of 1812 & Foreign Affairs","term":"Battle of New Orleans","year":"January 1815","ch":"P4","def":"Definition: Andrew Jackson's decisive victory over British forces, fought after the peace treaty was signed but before news reached America; made Jackson a national hero. Significance: The lopsided victory, though strategically meaningless, gave Americans a sense of triumph, boosted Jackson's fame toward the presidency, and helped secure the Treaty of Ghent's terms.","similar":"Andrew Jackson; Treaty of Ghent"},{"category":"The War of 1812 & Foreign Affairs","term":"Treaty of Ghent (1814)","year":"1814","ch":"P4","def":"Definition: Ended the War of 1812, restoring prewar boundaries with no mention of impressment or the issues that had caused the war. Significance: It ended the war without resolving the issues that caused it, but let both sides claim victory and opened the way to a long era of peaceful U.S.-British relations.","similar":"War of 1812"},{"category":"The War of 1812 & Foreign Affairs","term":"Hartford Convention (1814)","year":"1814","ch":"P4","def":"Definition: Meeting of New England Federalists who opposed the War of 1812 and discussed grievances/secession; the party's association with disloyalty contributed to its collapse. Significance: Its demands arrived just as news of Jackson's victory and the peace treaty broke, discrediting the Federalist Party and hastening its collapse as a national political force.","similar":"War of 1812"},{"category":"Postwar Nationalism & the Supreme Court","term":"Era of Good Feelings","year":"c. 1817-1825","ch":"P4","def":"Definition: Period of one-party rule and apparent national unity under Monroe, though sectional tensions simmered beneath the surface. Significance: The surface unity of one-party rule masked growing sectional and economic tensions — over tariffs, banking, and slavery's expansion — that would soon reopen partisan conflict.","similar":"James Monroe"},{"category":"Postwar Nationalism & the Supreme Court","term":"James Monroe","year":"1758-1831; Pres. 1817-1825","ch":"P4","def":"Definition: Fifth President during the Era of Good Feelings; issued the Monroe Doctrine. Significance: His presidency oversaw the high point of postwar nationalism and the Monroe Doctrine, even as sectional tensions over slavery's expansion simmered beneath the apparent calm.","similar":"Monroe Doctrine"},{"category":"Postwar Nationalism & the Supreme Court","term":"Monroe Doctrine (1823)","year":"1823","ch":"P4","def":"Definition: Declared the Western Hemisphere closed to further European colonization, asserting U.S. influence in the Americas. Significance: It became a cornerstone of U.S. foreign policy for the next century, even though the young nation initially lacked the military power to enforce it on its own.","similar":"James Monroe"},{"category":"Postwar Nationalism & the Supreme Court","term":"John Marshall","year":"Chief Justice 1801-1835","ch":"P4","def":"Definition: Supreme Court Chief Justice whose rulings (Marbury, McCulloch, Gibbons) established judicial review and strengthened federal power. Significance: His long tenure built a Supreme Court that could check Congress and the states, permanently strengthening the federal judiciary relative to the other branches.","similar":"Marbury v. Madison; McCulloch v. Maryland"},{"category":"Postwar Nationalism & the Supreme Court","term":"Marbury v. Madison","year":"1803","ch":"P4","def":"Definition: Established the principle of judicial review, giving the Supreme Court power to strike down unconstitutional laws. Significance: It was the first time the Court struck down an act of Congress, establishing judicial review as a lasting check on the other branches even though it was not used again until 1857.","similar":"John Marshall"},{"category":"Postwar Nationalism & the Supreme Court","term":"McCulloch v. Maryland","year":"1819","ch":"P4","def":"Definition: Upheld the constitutionality of the national bank and established that states cannot tax federal institutions, affirming implied powers. Significance: By upholding the bank's constitutionality and denying states the power to tax federal institutions, it affirmed a broad reading of federal power that strengthened the national government over the states.","similar":"Second Bank of the U.S."},{"category":"Postwar Nationalism & the Supreme Court","term":"Gibbons v. Ogden","year":"1824","ch":"P4","def":"Definition: Established federal authority over interstate commerce, broadly interpreting the Commerce Clause. Significance: It gave Congress sweeping authority over interstate commerce, a precedent that would underpin federal economic regulation for the rest of American history.","similar":"John Marshall"},{"category":"Postwar Nationalism & the Supreme Court","term":"Missouri Compromise (1820)","year":"1820","ch":"P4","def":"Definition: Admitted Missouri as a slave state and Maine as a free state while banning slavery north of 36°30' in the Louisiana territory, temporarily easing sectional tension. Significance: It temporarily defused the first major sectional crisis over slavery's expansion, but the 36°30' line it drew foreshadowed the deeper North-South split that would erupt again by midcentury.","similar":"Tallmadge Amendment"},{"category":"The Market Revolution & Industry","term":"Market Revolution","year":"c. 1815-1840s","ch":"P4","def":"Definition: Transformation of the American economy through transportation improvements, factory production, and growing interstate/international trade. Significance: It reshaped how Americans worked, traded, and lived, replacing local, self-sufficient economies with a national market tied together by new transportation and factory production.","similar":"Erie Canal; Railroads"},{"category":"The Market Revolution & Industry","term":"Erie Canal","year":"Completed 1825","ch":"P4","def":"Definition: Canal linking the Hudson River to Lake Erie, dramatically cutting transport costs and spurring the growth of New York City and western settlement. Significance: It made New York City the nation's leading port, slashed the cost of moving western goods east, and touched off a wave of canal-building across the country.","similar":"Market Revolution"},{"category":"The Market Revolution & Industry","term":"Henry Clay's American System","year":"Proposed 1810s-1820s","ch":"P4","def":"Definition: Economic plan combining a protective tariff, national bank, and internal improvements to unify and strengthen the national economy. Significance: It became the central economic program of the National Republican and later Whig parties, and the fight over its tariff and bank components shaped party politics for decades.","similar":"Second Bank of the U.S.; Tariff of 1816"},{"category":"The Market Revolution & Industry","term":"Second Bank of the United States","year":"Chartered 1816","ch":"P4","def":"Definition: National bank meant to stabilize currency and credit; became a central issue in Jackson's presidency (the 'Bank War'). Significance: It became a lightning rod for Jacksonian opposition to concentrated financial power, and Jackson's war against it reshaped American banking and politics in the 1830s.","similar":"Nicholas Biddle; Pet Banks"},{"category":"The Market Revolution & Industry","term":"Eli Whitney; Interchangeable Parts","year":"Cotton gin 1793; parts system early 1800s","ch":"P4","def":"Definition: Inventor of the cotton gin (boosting cotton/slavery) and pioneer of interchangeable parts manufacturing, enabling mass production. Significance: The cotton gin entrenched and expanded slavery across the South, while interchangeable parts manufacturing laid the groundwork for American industrial mass production.","similar":"King Cotton; Market Revolution"},{"category":"The Market Revolution & Industry","term":"Lowell System; Textile Mills","year":"1820s-1830s","ch":"P4","def":"Definition: Massachusetts factory system employing young farm women in textile mills with supervised housing — an early model of industrial labor. Significance: It demonstrated that factory labor could be organized around young unmarried women rather than families, becoming an influential early model that later, harsher factory systems would abandon.","similar":"Factory system; Industrialization"},{"category":"The Market Revolution & Industry","term":"Panic of 1819","year":"1819","ch":"P4","def":"Definition: First major U.S. financial crisis, caused by bank over-speculation in western land; led to widespread foreclosures and distrust of banks. Significance: It was the young nation's first major depression, souring many Americans on speculative banking and feeding the populist, anti-bank sentiment that Andrew Jackson would later ride to power.","similar":"Second Bank of the U.S."},{"category":"The Market Revolution & Industry","term":"Railroads","year":"Expanding from 1830s","ch":"P4","def":"Definition: New transportation technology that increasingly rivaled canals, tying the Northeast and Midwest economies together. Significance: As they expanded, they increasingly outcompeted canals and further bound the Northeast and Midwest into a single national economy, deepening the South's relative economic isolation.","similar":"Erie Canal; Market Revolution"},{"category":"Jacksonian Democracy & Politics","term":"Common Man; Universal White Male Suffrage","year":"1820s-1830s","ch":"P4","def":"Definition: Expansion of voting rights to all white men regardless of property ownership, broadening democratic participation in this era. Significance: The expansion of the franchise transformed American political culture into one built around mass participation and popular campaigning, exemplified by Jackson's own rise.","similar":"Andrew Jackson"},{"category":"Jacksonian Democracy & Politics","term":"Andrew Jackson","year":"1767-1845; Pres. 1829-1837","ch":"P4","def":"Definition: Seventh President, symbol of the 'common man,' known for the spoils system, the Bank War, and Indian Removal. Significance: As the first president from outside the Virginia-Massachusetts elite, his presidency redefined American democracy around the 'common man' while also presiding over Indian removal and a dangerous expansion of executive power.","similar":"Spoils system; Indian Removal Act"},{"category":"Jacksonian Democracy & Politics","term":"\"Corrupt Bargain\"","year":"Election of 1824","ch":"P4","def":"Definition: Jackson supporters' term for the 1824 outcome, in which Henry Clay's support helped John Quincy Adams win in the House, and Clay was then named Secretary of State. Significance: The controversy fueled Jackson's narrative that entrenched elites had stolen the 1824 election from the popular will, propelling him to victory in 1828 and reshaping American party politics.","similar":"Henry Clay; John Quincy Adams"},{"category":"Jacksonian Democracy & Politics","term":"Spoils System","year":"Practiced widely from 1829","ch":"P4","def":"Definition: Practice of rewarding political supporters with government jobs; associated with Jackson's 'rotation in office.' Significance: It tied political patronage directly to electoral victory, strengthening party loyalty and organization even as critics condemned it as corrupt and unqualified.","similar":"Andrew Jackson"},{"category":"Jacksonian Democracy & Politics","term":"Tariff of 1828; \"Tariff of Abominations\"","year":"1828","ch":"P4","def":"Definition: High protective tariff deeply unpopular in the South, which saw it as benefiting Northern industry at Southern expense. Significance: Southern anger over the tariff's effect on their export-dependent economy directly triggered the Nullification Crisis and sharpened sectional divisions over federal economic power.","similar":"Nullification Crisis"},{"category":"Jacksonian Democracy & Politics","term":"Nullification Crisis","year":"1832-1833","ch":"P4","def":"Definition: Confrontation after South Carolina declared the tariff null and void within its borders, testing federal authority; resolved by a compromise tariff and the Force Bill. Significance: Jackson's forceful response affirmed federal supremacy over a state's claim to nullify federal law, but South Carolina's defiance previewed the states'-rights arguments the South would use to justify secession decades later.","similar":"Tariff of 1828; John C. Calhoun"},{"category":"Jacksonian Democracy & Politics","term":"Indian Removal Act (1830)","year":"1830","ch":"P4","def":"Definition: Authorized the forced relocation of Native American tribes from the Southeast to land west of the Mississippi. Significance: It authorized the forced displacement of tens of thousands of Native Americans from their homelands, directly causing the Trail of Tears and other removal tragedies.","similar":"Cherokee Trail of Tears"},{"category":"Jacksonian Democracy & Politics","term":"Cherokee Trail of Tears","year":"1838-1839","ch":"P4","def":"Definition: Forced march of the Cherokee Nation to Indian Territory, resulting in thousands of deaths despite the Supreme Court's ruling in their favor in Worcester v. Georgia. Significance: It showed that even a favorable Supreme Court ruling could not protect Native American sovereignty against a determined president and Congress, and it remains one of the era's starkest human costs.","similar":"Indian Removal Act"},{"category":"Jacksonian Democracy & Politics","term":"Panic of 1837; Martin Van Buren","year":"1837-1843; Van Buren Pres. 1837-1841","ch":"P4","def":"Definition: Severe economic depression that struck shortly after Van Buren took office, linked partly to Jackson's hard-money policies (Specie Circular). Significance: The depression discredited Van Buren and the Democrats just two years into his term, showing how closely tied Jacksonian hard-money policy was to the nation's financial stability.","similar":"Specie Circular"},{"category":"Jacksonian Democracy & Politics","term":"Whigs and Democrats; Two-Party System","year":"Formed 1830s","ch":"P4","def":"Definition: Rival parties emerging from Jacksonian-era politics: Democrats (Jackson's coalition) versus Whigs (opponents of 'King Andrew'). Significance: The rivalry between the two parties organized American politics for the next two decades around competing visions of federal power, the economy, and the proper scope of government.","similar":"Andrew Jackson"},{"category":"Reform Movements & Religion","term":"Second Great Awakening","year":"c. 1790s-1840s","ch":"P4","def":"Definition: Protestant religious revival movement emphasizing personal salvation and reform, inspiring many antebellum social reform movements. Significance: It reshaped American religious life, built the Methodist and Baptist churches into the largest Protestant denominations, and supplied the moral energy behind decades of antebellum reform movements.","similar":"Revivalism"},{"category":"Reform Movements & Religion","term":"Revivalism; Revival (Camp) Meetings","year":"1800s-1830s","ch":"P4","def":"Definition: Large outdoor religious gatherings central to the Second Great Awakening, emphasizing emotional conversion experiences. Significance: These emotional mass gatherings were the engine of the Second Great Awakening, spreading evangelical Protestantism far beyond established churches and into the frontier.","similar":"Second Great Awakening"},{"category":"Reform Movements & Religion","term":"Church of Latter-Day Saints; Joseph Smith","year":"Founded 1830","ch":"P4","def":"Definition: New religious movement founded by Joseph Smith; Mormons faced persecution and migrated west under Brigham Young to found 'New Zion' (Utah). Significance: Persistent persecution and Smith's murder pushed Mormons to migrate to Utah under Brigham Young, illustrating both the religious ferment and the intolerance of the era.","similar":"Brigham Young"},{"category":"Reform Movements & Religion","term":"Temperance Movement; American Temperance Society","year":"Founded 1826","ch":"P4","def":"Definition: Reform movement aimed at reducing or eliminating alcohol consumption, tied to broader moral reform efforts of the era. Significance: It became one of the largest and most lasting reform movements of the era, laying groundwork for the Prohibition movement nearly a century later.","similar":"Second Great Awakening"},{"category":"Reform Movements & Religion","term":"Horace Mann; Public School Movement","year":"1830s-1840s","ch":"P4","def":"Definition: Massachusetts reformer who championed tax-funded public education, standardized curricula, and better-trained teachers. Significance: Mann's reforms established the foundation for modern tax-funded, standardized public education in the United States.","similar":"McGuffey Readers"},{"category":"Reform Movements & Religion","term":"Dorothea Dix; Asylum Movement","year":"1840s","ch":"P4","def":"Definition: Reformer who exposed the mistreatment of the mentally ill and advocated for dedicated asylums rather than prisons/poorhouses. Significance: Her advocacy shifted public policy toward treating mental illness as a medical issue deserving dedicated care rather than imprisonment or neglect.","similar":"Penitentiaries"},{"category":"Reform Movements & Religion","term":"Auburn System; Penitentiaries","year":"Developed 1820s-1830s","ch":"P4","def":"Definition: Prison reform model emphasizing silent labor and moral rehabilitation rather than purely punitive confinement. Significance: It reflected a new antebellum belief that criminals could be morally reformed through discipline and labor rather than simply punished, shaping American prison design for generations.","similar":"Dorothea Dix"},{"category":"Reform Movements & Religion","term":"Utopian Communities","year":"1820s-1840s","ch":"P4","def":"Definition: Experimental communal societies (Shakers, Oneida, New Harmony, Brook Farm) seeking to build ideal social and economic orders outside mainstream society. Significance: These experiments tested alternative visions of property, family, and social organization, and though most failed quickly, they reflected the era's broader optimism about social reform.","similar":"New Harmony; Oneida Community"},{"category":"Reform Movements & Religion","term":"Transcendentalism; Emerson; Thoreau","year":"1830s-1850s","ch":"P4","def":"Definition: Philosophical/literary movement emphasizing individualism, intuition, and the spiritual value of nature over materialism and conformity. Significance: The movement's emphasis on individual conscience over social convention influenced American reform movements, literature, and later writers from Whitman to civil disobedience theorists like Martin Luther King Jr.","similar":"Brook Farm"},{"category":"Reform Movements & Religion","term":"Antebellum Period","year":"c. 1812-1861","ch":"P4","def":"Definition: General term for the pre-Civil War era marked by reform movements, westward expansion, and deepening sectional conflict. Significance: It frames the decades in which the reform movements, economic transformation, and sectional tensions covered in this unit built toward the Civil War.","similar":"Second Great Awakening"},{"category":"Abolition & Slavery","term":"William Lloyd Garrison; The Liberator","year":"Founded 1831","ch":"P4","def":"Definition: Radical abolitionist newspaper editor who called for the immediate, uncompensated end of slavery. Significance: His uncompromising demand for immediate abolition radicalized the antislavery movement and made him one of the most polarizing, influential reformers of the era.","similar":"American Antislavery Society"},{"category":"Abolition & Slavery","term":"Frederick Douglass; The North Star","year":"Newspaper founded 1847","ch":"P4","def":"Definition: Formerly enslaved abolitionist, orator, and writer whose autobiography and newspaper powerfully advanced the antislavery cause. Significance: As a formerly enslaved man speaking from direct experience, Douglass gave the abolitionist movement a moral authority and eloquence that white reformers alone could not provide.","similar":"William Lloyd Garrison"},{"category":"Abolition & Slavery","term":"Harriet Tubman","year":"c. 1822-1913","ch":"P4","def":"Definition: Formerly enslaved 'conductor' on the Underground Railroad who led dozens of enslaved people to freedom. Significance: Her repeated, dangerous trips back into slave states to lead others to freedom made her one of the most celebrated figures of the Underground Railroad and antislavery resistance.","similar":"Frederick Douglass"},{"category":"Abolition & Slavery","term":"American Colonization Society","year":"Founded 1816","ch":"P4","def":"Definition: Organization promoting the resettlement of free Black Americans in Africa (Liberia); reflected ambivalence even among some antislavery whites. Significance: Its support from some antislavery whites alongside slaveholders revealed deep ambivalence about Black citizenship, and most free Black Americans rejected its colonization plan outright.","similar":"Abolitionism"},{"category":"Abolition & Slavery","term":"American Antislavery Society","year":"Founded 1833","ch":"P4","def":"Definition: National abolitionist organization led by Garrison and others advocating immediate emancipation. Significance: It became the main organizational vehicle for immediate abolitionism in the 1830s, though internal disputes over tactics and women's roles later split the movement.","similar":"William Lloyd Garrison"},{"category":"Abolition & Slavery","term":"Nat Turner's Rebellion","year":"1831","ch":"P4","def":"Definition: Violent slave uprising in Virginia that killed dozens of whites and led to harsher slave codes and restrictions across the South. Significance: The violence terrified white Southerners and led directly to harsher slave codes and tighter restrictions on enslaved people's movement, literacy, and assembly across the South.","similar":"Slave Codes; Denmark Vesey"},{"category":"Abolition & Slavery","term":"King Cotton; Slave Codes","year":"Cotton economy 1800s-1860s","ch":"P4","def":"Definition: 'King Cotton' describes the South's dependence on cotton and slave labor; Slave Codes were laws restricting the rights and movement of enslaved people. Significance: Dependence on cotton tied the South's economy ever more tightly to slavery, while slave codes hardened into increasingly repressive legal control over enslaved people's lives.","similar":"Eli Whitney; Nat Turner"},{"category":"Abolition & Slavery","term":"Denmark Vesey","year":"Planned 1822","ch":"P4","def":"Definition: Free Black man who planned a large slave revolt in Charleston, South Carolina, that was discovered before it occurred, leading to increased Southern fear and repression. Significance: Fear generated by his discovered plot led southern governments to further restrict Black churches, free Black Americans' movement, and enslaved people's assembly.","similar":"Nat Turner"},{"category":"Women's Rights & New Ideas","term":"Seneca Falls Convention (1848)","year":"1848","ch":"P4","def":"Definition: First women's rights convention in the U.S., producing the Declaration of Sentiments modeled on the Declaration of Independence. Significance: It launched the organized women's rights movement in the United States and set the demand for suffrage as a central, long-term goal.","similar":"Elizabeth Cady Stanton"},{"category":"Women's Rights & New Ideas","term":"Elizabeth Cady Stanton","year":"1815-1902","ch":"P4","def":"Definition: Leading organizer of the Seneca Falls Convention and author of the Declaration of Sentiments demanding women's rights, including suffrage. Significance: Her Declaration of Sentiments reframed the Declaration of Independence's language of equality to include women, shaping the rhetoric of the women's rights movement for decades.","similar":"Seneca Falls Convention; Susan B. Anthony"},{"category":"Women's Rights & New Ideas","term":"Susan B. Anthony","year":"1820-1906","ch":"P4","def":"Definition: Prominent women's rights and suffrage activist who partnered closely with Stanton in the movement. Significance: Her decades-long partnership with Stanton and tireless organizing made her one of the most important strategists and public faces of the suffrage movement.","similar":"Elizabeth Cady Stanton"},{"category":"Women's Rights & New Ideas","term":"Cult of Domesticity","year":"Prevailing ideology, mid-1800s","ch":"P4","def":"Definition: Idealized view of women's proper role as centered on home, family, and moral guidance rather than public/political life; reform movements challenged this. Significance: By idealizing women's role as confined to home and family, it gave reformers like Stanton and the Grimke sisters a clear ideology to challenge in demanding broader rights.","similar":"Women's Rights Movement"},{"category":"Women's Rights & New Ideas","term":"Sarah and Angelina Grimke","year":"Active 1830s-1840s","ch":"P4","def":"Definition: Southern-born sisters who became prominent abolitionist and women's rights advocates, linking the two causes. Significance: As Southern-born women speaking publicly against both slavery and women's subordination, they linked the abolitionist and women's rights causes and faced fierce criticism for stepping outside women's traditional role.","similar":"William Lloyd Garrison; Women's Rights"},{"category":"Women's Rights & New Ideas","term":"Hudson River School; Thomas Cole","year":"1820s-1870s","ch":"P4","def":"Definition: American landscape painting movement celebrating the grandeur of the American wilderness, reflecting national pride and Romantic ideals. Significance: Its romanticized landscapes helped build a sense of American national identity rooted in the continent's natural grandeur, distinct from Europe's artistic traditions.","similar":"Transcendentalism"},{"category":"Immigration & Identity","term":"Nativism; Know-Nothing (American) Party","year":"Party formed 1850s","ch":"P4","def":"Definition: Anti-immigrant political movement opposing Irish and German Catholic immigration, fearing loss of 'American' culture and jobs. Significance: Its rapid rise showed how economic anxiety and anti-Catholic prejudice could be mobilized into a major political movement, foreshadowing later waves of American nativism.","similar":"Irish Immigration"},{"category":"Immigration & Identity","term":"Irish Immigration; Potato Famine","year":"Famine 1845-1852","ch":"P4","def":"Definition: Mass Irish immigration to the U.S. driven by famine in Ireland; immigrants faced discrimination and often settled in growing cities. Significance: The massive influx of Irish Catholic immigrants reshaped Northern cities and fueled the nativist backlash that produced the Know-Nothing movement.","similar":"Know-Nothing Party"},{"category":"Immigration & Identity","term":"Planters; \"Codes of Chivalry\"","year":"Antebellum South, 1800s-1860s","ch":"P4","def":"Definition: Wealthy Southern slaveholding elite who dominated the region's economy, politics, and social ideals of honor. Significance: This elite's social and political dominance entrenched slavery's defense as central to Southern identity and politics in the decades before the Civil War.","similar":"King Cotton"},{"category":"Immigration & Identity","term":"Urbanization","year":"Accelerating 1820s-1850s","ch":"P4","def":"Definition: Rapid growth of American cities driven by immigration and industrialization, creating new social and public health challenges. Significance: Rapid city growth created crowded, often unsanitary conditions that spurred new public health and reform efforts even as it concentrated economic opportunity.","similar":"Irish Immigration; Market Revolution"},{"category":"Immigration & Identity","term":"Tammany Hall","year":"Prominent from early-mid 1800s","ch":"P4","def":"Definition: New York City Democratic political machine that built support (including among immigrants) through patronage and favors. Significance: Its patronage-based model of urban politics, built partly on immigrant support, became the prototype for the political machines that would dominate many American cities for the rest of the century.","similar":"Irish Immigration"},{"category":"Westward Expansion & Manifest Destiny","term":"Manifest Destiny","year":"Term popularized 1845","ch":"P4","def":"Definition: Belief that American expansion across the continent was divinely ordained and inevitable; used to justify westward expansion and war with Mexico. Significance: This belief provided the ideological justification for seizing Native and Mexican land across the continent, including the war with Mexico.","similar":"Mexican-American War"},{"category":"Westward Expansion & Manifest Destiny","term":"Texas Independence; Sam Houston; the Alamo","year":"1835-1836","ch":"P4","def":"Definition: American settlers in Mexican Texas revolted and won independence after the famous siege of the Alamo (1836); Texas remained an independent republic until annexed in 1845. Significance: Texas's independence and later annexation set off the border dispute with Mexico that triggered the Mexican-American War.","similar":"Stephen Austin"},{"category":"Westward Expansion & Manifest Destiny","term":"Oregon Territory; \"Fifty-Four Forty or Fight!\"","year":"Dispute resolved 1846","ch":"P4","def":"Definition: Territorial dispute with Britain over the Pacific Northwest; settled by treaty at the 49th parallel rather than the more aggressive line demanded by expansionists. Significance: The peaceful settlement at the 49th parallel avoided a war with Britain while still securing vast new territory for the United States.","similar":"James K. Polk"},{"category":"Westward Expansion & Manifest Destiny","term":"James K. Polk","year":"1795-1849; Pres. 1845-1849","ch":"P4","def":"Definition: Expansionist President who oversaw the annexation of Texas, the Oregon settlement, and the Mexican-American War. Significance: His aggressive expansionist agenda added more territory to the United States than any president before him, but the Mexican Cession's slavery question reopened the sectional crisis.","similar":"Manifest Destiny"},{"category":"Westward Expansion & Manifest Destiny","term":"Mexican-American War","year":"1846-1848","ch":"P4","def":"Definition: War fought over Texas's disputed border and American expansionist ambitions; resulted in the U.S. acquiring vast new southwestern territory. Significance: The war's territorial gains reignited the explosive debate over slavery's expansion into new territories, a conflict that would dominate American politics through the 1850s.","similar":"Treaty of Guadalupe-Hidalgo"},{"category":"Westward Expansion & Manifest Destiny","term":"Treaty of Guadalupe-Hidalgo (1848)","year":"1848","ch":"P4","def":"Definition: Ended the Mexican-American War; Mexico ceded California and the Southwest (Mexican Cession) to the U.S. in exchange for payment. Significance: It completed America's continental expansion to the Pacific but immediately forced the nation to confront whether slavery would extend into the new territories.","similar":"Mexican Cession"},{"category":"Westward Expansion & Manifest Destiny","term":"Mexican Cession","year":"1848","ch":"P4","def":"Definition: Vast territory (including California, Nevada, Utah, and parts of other states) ceded by Mexico after the war, reigniting debates over slavery's expansion. Significance: The vast new territory it added reopened the sectional conflict over slavery's expansion that the Missouri Compromise had once tried to settle.","similar":"Wilmot Proviso"},{"category":"Westward Expansion & Manifest Destiny","term":"Wilmot Proviso","year":"Proposed 1846","ch":"P4","def":"Definition: Failed proposal to ban slavery in any territory gained from the Mexican-American War; intensified sectional conflict despite never passing. Significance: Although it never passed, the proposal exposed how deeply slavery's expansion divided North and South and previewed the sectional battles of the 1850s.","similar":"Mexican Cession"},{"category":"Westward Expansion & Manifest Destiny","term":"Stephen Austin","year":"1793-1836","ch":"P4","def":"Definition: Empresario who led the first major legal American settlement in Mexican Texas, foundational to Texas's development and eventual independence. Significance: His settlement laid the demographic foundation for the influx of American settlers whose cultural and political friction with Mexico led to the Texas Revolution.","similar":"Texas Independence"},{"category":"Westward Expansion & Manifest Destiny","term":"American Indian Removal; Great Plains Migration","year":"1830s-1840s","ch":"P4","def":"Definition: Broader policy and process of displacing Native peoples from both the Southeast and advancing frontier to lands further west, including the Great Plains. Significance: This continued displacement of Native peoples cleared land for American settlers and set the stage for further conflicts as expansion pushed onto the Great Plains.","similar":"Indian Removal Act"}];
  var EXTRA = [{"category":"Extra Credit","term":"John C. Calhoun","year":"1782-1850","ch":"P4","def":"Definition: War Hawk turned leading Southern states'-rights advocate; developed nullification theory and later opposed the tariff as Vice President under Jackson. Significance: His shift from nationalist War Hawk to the leading theorist of states' rights and nullification shows how the South's growing dependence on slavery reshaped its politics.","similar":"Nullification Crisis; War Hawks"},{"category":"Extra Credit","term":"Henry Clay","year":"1777-1852","ch":"P4","def":"Definition: 'Great Compromiser'; War Hawk, architect of the American System, and longtime Whig leader behind the Missouri Compromise and later the Compromise of 1850. Significance: As the architect of major sectional compromises across four decades, his career illustrates both the possibilities and the limits of political compromise in holding the Union together.","similar":"American System; War Hawks"},{"category":"Extra Credit","term":"Francis Scott Key; \"The Star-Spangled Banner\"","year":"Written 1814","ch":"P4","def":"Definition: Key wrote the poem that became the U.S. national anthem after witnessing the British bombardment of Fort McHenry during the War of 1812. Significance: His poem, later set to music and eventually made the national anthem, became a lasting symbol of the surge in American nationalism the War of 1812 produced.","similar":"War of 1812"},{"category":"Extra Credit","term":"Battle of Tippecanoe; William Henry Harrison","year":"1811","ch":"P4","def":"Definition: U.S. victory over Tecumseh's confederacy in the Indiana Territory, boosting Harrison's reputation (later President in 1841). Significance: The battle broke Tecumseh's confederacy while it was still forming and gave Harrison a political reputation he would ride to the presidency three decades later.","similar":"Tecumseh"},{"category":"Extra Credit","term":"Battle of Lake Erie; Oliver Hazard Perry","year":"1813","ch":"P4","def":"Definition: American naval victory securing U.S. control of Lake Erie during the War of 1812. Significance: The victory secured American control of the Great Lakes region and helped set up the later U.S. recapture of Detroit.","similar":"War of 1812"},{"category":"Extra Credit","term":"Battle of Horseshoe Bend; Creek War","year":"1814","ch":"P4","def":"Definition: Andrew Jackson's decisive victory over the Creek Nation, resulting in a major Creek land cession. Significance: The crushing defeat forced the Creek Nation to cede vast territory, opening much of the Deep South to American cotton agriculture and slavery's expansion.","similar":"Andrew Jackson"},{"category":"Extra Credit","term":"Napoleon Bonaparte; Barbary Pirates","year":"Early 1800s","ch":"P4","def":"Definition: European and North African conflicts entangling the young U.S. in questions of neutral trading rights and naval defense. Significance: These entanglements tested the young nation's ability to defend neutral trading rights and projected American naval power abroad for the first time.","similar":"Louisiana Purchase"},{"category":"Extra Credit","term":"Lewis and Clark Expedition","year":"1804-1806","ch":"P4","def":"Definition: Expedition commissioned by Jefferson to explore and map the Louisiana Purchase territory and reach the Pacific. Significance: Its detailed reports on the land, peoples, and resources of the West opened the way for the traders and settlers who followed into the Louisiana Purchase territory.","similar":"Louisiana Purchase; Thomas Jefferson"},{"category":"Extra Credit","term":"Fletcher v. Peck; Dartmouth College v. Woodward","year":"1810; 1819","ch":"P4","def":"Definition: Marshall Court rulings protecting the sanctity of contracts from state interference, strengthening property rights and limiting state power. Significance: These rulings protected private contracts from state interference, strengthening property rights and limiting state power in ways that encouraged investment and economic growth.","similar":"John Marshall"},{"category":"Extra Credit","term":"Tallmadge Amendment","year":"1819","ch":"P4","def":"Definition: Failed proposal to gradually end slavery in Missouri, which touched off the crisis resolved by the Missouri Compromise. Significance: Its failure to pass touched off the sectional crisis that the Missouri Compromise was designed to resolve, foreshadowing decades of conflict over slavery's expansion.","similar":"Missouri Compromise"},{"category":"Extra Credit","term":"Nicholas Biddle; Roger Taney","year":"1820s-1830s","ch":"P4","def":"Definition: Biddle led the Second Bank of the U.S.; Taney, Jackson's ally, helped dismantle it and later became Chief Justice. Significance: Their roles on opposite sides of the Bank War show how deeply the fight over the Second Bank of the United States divided Jacksonian-era politics.","similar":"Second Bank of the U.S."},{"category":"Extra Credit","term":"Specie Circular (1836)","year":"1836","ch":"P4","def":"Definition: Jackson administration order requiring payment in gold/silver for public land, intended to curb speculation but contributing to the Panic of 1837. Significance: By requiring hard currency for public land, it helped trigger the bank runs and credit collapse of the Panic of 1837.","similar":"Panic of 1837"},{"category":"Extra Credit","term":"\"Pet Banks\"","year":"1833 onward","ch":"P4","def":"Definition: State banks that received federal deposits after Jackson withdrew funds from the Second Bank of the United States. Significance: Their use to hold federal deposits after Jackson's bank war contributed to looser lending standards and the speculative bubble that collapsed in 1837.","similar":"Second Bank of the U.S."},{"category":"Extra Credit","term":"Anti-Masonic Party; Workingmen's Party","year":"1820s-1830s","ch":"P4","def":"Definition: Early third parties reflecting new political movements and anxieties of the Jacksonian era; the Anti-Masons held the first party nominating convention. Significance: These early third parties reflected new popular anxieties — about secret societies and labor conditions — that mainstream parties had not yet addressed.","similar":"Two-Party System"},{"category":"Extra Credit","term":"Worcester v. Georgia; Cherokee Nation v. Georgia","year":"1831; 1832","ch":"P4","def":"Definition: Supreme Court cases affirming tribal sovereignty; Jackson reportedly ignored the ruling, allowing removal to proceed. Significance: Jackson's reported refusal to enforce the Court's ruling showed that constitutional protections for Native nations depended on executive enforcement the government was unwilling to provide.","similar":"Cherokee Trail of Tears"},{"category":"Extra Credit","term":"Robert Owen; New Harmony","year":"Founded 1825","ch":"P4","def":"Definition: British industrialist-reformer who founded a short-lived utopian socialist community in Indiana. Significance: Its quick collapse illustrated the practical difficulties utopian socialist experiments faced in sustaining themselves outside the market economy.","similar":"Utopian Communities"},{"category":"Extra Credit","term":"Oneida Community; John Humphrey Noyes","year":"Founded 1848","ch":"P4","def":"Definition: Utopian religious community in New York practicing communal property and controversial social/marital arrangements under Noyes's leadership. Significance: Its unconventional social and marital practices made it one of the most controversial of the era's utopian experiments, testing the limits of religious and social tolerance.","similar":"Utopian Communities"},{"category":"Extra Credit","term":"Brook Farm; George Ripley","year":"Founded 1841","ch":"P4","def":"Definition: Transcendentalist utopian community in Massachusetts emphasizing intellectual life alongside manual labor. Significance: It brought Transcendentalist ideals into practice, attracting prominent writers and thinkers even though the community itself proved short-lived.","similar":"Transcendentalism"},{"category":"Extra Credit","term":"Margaret Fuller","year":"1810-1850","ch":"P4","def":"Definition: Transcendentalist writer, journalist, and early feminist who argued for women's intellectual equality. Significance: Her writing on women's intellectual equality made her one of the era's most influential feminist voices within the Transcendentalist movement.","similar":"Transcendentalism; Women's Rights"},{"category":"Extra Credit","term":"Liberty Party","year":"Founded 1840","ch":"P4","def":"Definition: Early antislavery political party advocating abolition through the political process rather than moral suasion alone. Significance: As the first antislavery political party, it showed abolitionists dividing over whether to pursue change through moral persuasion or electoral politics, a split that widened in the 1840s.","similar":"Abolitionism"},{"category":"Extra Credit","term":"Sojourner Truth","year":"c. 1797-1883","ch":"P4","def":"Definition: Formerly enslaved abolitionist and women's rights advocate known for powerful public speaking. Significance: Her powerful public speaking connected the struggles for Black freedom and women's rights, making her one of the era's most compelling reform voices.","similar":"Abolitionism; Women's Rights"},{"category":"Extra Credit","term":"American Peace Society","year":"Founded 1828","ch":"P4","def":"Definition: Reform organization promoting pacifism and opposition to war, part of the broader antebellum reform impulse. Significance: It represented the broader antebellum reform impulse extending beyond slavery and temperance into questioning the morality of war itself.","similar":"Reform Movements"},{"category":"Extra Credit","term":"McGuffey Readers","year":"First published 1836","ch":"P4","def":"Definition: Widely used elementary school textbooks that shaped morality and literacy instruction for generations of American children. Significance: Their widespread use standardized literacy instruction and moral education for generations of American schoolchildren well beyond the antebellum period.","similar":"Public School Movement"},{"category":"Extra Credit","term":"Washington Irving; James Fenimore Cooper; Nathaniel Hawthorne","year":"Early-mid 1800s","ch":"P4","def":"Definition: Early American authors who helped establish a distinctly national literature during the antebellum period. Significance: Their work helped establish a distinctly American literary tradition independent of European models, paralleling the cultural nationalism of the era.","similar":"Hudson River School"},{"category":"Extra Credit","term":"Ostend Manifesto (1854)","year":"1854","ch":"P4","def":"Definition: Leaked proposal by U.S. diplomats suggesting the purchase or seizure of Cuba from Spain, embarrassing the Pierce administration and fueling sectional suspicion over slavery's expansion. Significance: Its leak embarrassed the Pierce administration and deepened Northern suspicion that Southern leaders sought to expand slave territory by any means, including seizing Cuba.","similar":"Manifest Destiny"}];

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function showTab(tab) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute("aria-selected", on ? "true" : "false");
      var panel = document.getElementById(t.getAttribute("aria-controls"));
      if (panel) panel.hidden = !on;
    });
    window.scrollTo(0, 0);
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { showTab(t); }); });

  function render(host, terms, filterText) {
    host.innerHTML = "";
    var q = (filterText || "").toLowerCase();
    var lastCat = null;
    terms.forEach(function (t) {
      if (q && !(t.term.toLowerCase().indexOf(q) !== -1 || t.def.toLowerCase().indexOf(q) !== -1 || t.category.toLowerCase().indexOf(q) !== -1)) return;
      if (t.category !== lastCat && t.category !== "Extra Credit") {
        host.appendChild(el("div", "cat-heading", esc(t.category)));
        lastCat = t.category;
      }
      var d = el("details");
      d.appendChild(el("summary", "", '<span>' + esc(t.term) + '</span><span class="chip">' + esc(t.year) + '</span>'));
      var body = el("div", "body");
      body.innerHTML = "<p>" + esc(t.def) + "</p>" +
        '<div class="label">Similar / related terms</div><p class="muted">' + esc(t.similar) + "</p>";
      d.appendChild(body);
      host.appendChild(d);
    });
    if (!host.children.length) host.appendChild(el("p", "muted", "No terms match your search."));
  }

  var reqHost = document.getElementById("reqHost");
  var extraHost = document.getElementById("extraHost");
  render(reqHost, REQUIRED, "");
  render(extraHost, EXTRA, "");

  document.getElementById("searchReq").addEventListener("input", function (e) { render(reqHost, REQUIRED, e.target.value); });
  document.getElementById("searchExtra").addEventListener("input", function (e) { render(extraHost, EXTRA, e.target.value); });
})();
